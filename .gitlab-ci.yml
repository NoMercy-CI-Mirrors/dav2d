.test-common:
    stage: test
    cache:
        key: testdata.git-20260605
        paths:
            - cache/dav2d-test-data.git/
    before_script:
        - test -d cache || mkdir cache
        - test -d cache/dav2d-test-data.git && GIT_DIR=cache/dav2d-test-data.git git remote update
        - test -d cache/dav2d-test-data.git || git clone --mirror https://code.videolan.org/videolan/dav2d-test-data.git cache/dav2d-test-data.git
        - git clone cache/dav2d-test-data.git tests/dav2d-test-data
        - git -C tests/dav2d-test-data describe --always --long
    dependencies: []
    artifacts:
        when: always
        reports:
          junit: build/meson-logs/testlog.junit.xml

test-debian:
    extends:
        - .debian-amd64-common
        - .test-common
    needs: ["build-debian"]
    script:
        - meson setup build --buildtype release
                            -Dtestdata_tests=true
                            -Denable_seek_stress=true
                            -Dlogging=false
                            -Db_coverage=true
                            -Dtrim_dsp=false
        - ninja -C build
        - cd build && time meson test -v
        - ninja coverage-html
        - mv meson-logs/coveragereport ../coverage
        - ninja coverage-xml
        - grep -Eo 'line-rate="[^"]+"' meson-logs/coverage.xml | head -n 1 |
          grep -Eo '[0-9.]+' | awk '{ print "coverage:", $1 * 100 } '
    coverage: '/^coverage: (\d+.\d+)$/'
    artifacts:
        expose_as: 'Coverage HTML report'
        paths:
            - coverage/
        reports:
            coverage_report:
                coverage_format: cobertura
                path: build/meson-logs/coverage.xml

test-debian-avx512:
    extends:
        - .debian-amd64-common
        - .test-common
    tags:
        - docker
        - amd64-avx512
    variables:
        CFLAGS: '-mavx'
    needs: ["build-debian-avx512"]
    script:
        - meson setup build --buildtype release
                            -Dtestdata_tests=true
                            -Dtrim_dsp=false
        - ninja -C build
        - cd build && time meson test --suite testdata --test-args "--cpumask avx512icl"
        - time meson test --suite testdata --test-args "--threads 2 --framedelay 2 --cpumask avx512icl"

test-debian-asan:
    extends:
        - .debian-amd64-common
        - .test-common
    needs: ["build-debian"]
    variables:
        ASAN_OPTIONS: 'detect_leaks=0'
    script:
        - meson setup build --buildtype debugoptimized
                            -Dtestdata_tests=true
                            -Dlogging=false
                            -Db_sanitize=address
        - ninja -C build
        - cd build
        - exit_code=0
        - time meson test -v --setup=sanitizer --suite checkasm || exit_code=$((exit_code + $?))
        - time meson test -v --setup=sanitizer --suite testdata --test-args "--cpumask 0"    || exit_code=$((exit_code + $?))
        - time meson test -v --setup=sanitizer --suite testdata --test-args "--cpumask 0xff" || exit_code=$((exit_code + $?))
        - if [ $exit_code -ne 0 ]; then exit $exit_code; fi

