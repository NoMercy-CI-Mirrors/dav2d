build-win:
    extends: .debian-amd64-common
    # GCC 15.2 miscompiles dav2d when vectorization is enabled (as it is
    # by default), see https://gcc.gnu.org/bugzilla/show_bug.cgi?id=122793.
    # This is fixed in future 15.x releases.
    variables:
        CFLAGS: '-fno-tree-vectorize'
    script:
        - wineserver -p && wine wineboot
        - meson setup build --buildtype release
                            --werror
                            --libdir lib
                            --prefix "$(pwd)/build/dav1d_install"
                            --cross-file package/crossfiles/${CROSSFILE}.meson
                            -Ddefault_library=both
                            -Dtrim_dsp=false
        - ninja -C build
        - cd build && meson test -v
        - ${CROSSFILE}-nm -A -g src/libdav2d.a | grep " [ABCDGRST] " | (! grep -E -v " \.| _*dav2d_")
    parallel:
      matrix:
        - CROSSFILE: [i686-w64-mingw32, x86_64-w64-mingw32]

